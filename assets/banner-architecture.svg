      <text x="76" y="39" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="7">https://mimik.dev</text>

      <!-- REC Live Indicator -->
      <circle cx="195" cy="36" r="3" fill="#EF4444"/>
      <text x="202" y="39" fill="#EF4444" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700">REC</text>

      <!-- Workflow Step Timeline inside window -->
      <line x1="45" y1="85" x2="195" y2="85" stroke="#2D2D42" stroke-width="2"/>

      <!-- Step 1 -->
      <rect x="35" y="65" width="38" height="40" rx="5" fill="#0D0D14" stroke="#6366F1" stroke-width="1.5"/>
      <text x="54" y="80" fill="#A5B4FC" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" text-anchor="middle">#01</text>
      <text x="54" y="95" fill="#94A3B8" font-family="'SF Mono', Consolas, monospace" font-size="7" text-anchor="middle">NAV</text>

      <!-- Step 2 (Active Target) -->
      <rect x="100" y="60" width="44" height="48" rx="6" fill="#181826" stroke="#6366F1" stroke-width="2.5"/>
      <text x="122" y="78" fill="#FFFFFF" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">#02</text>
      <text x="122" y="94" fill="#A5B4FC" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="600" text-anchor="middle">CLICK</text>

      <!-- Step 3 -->
      <rect x="165" y="65" width="38" height="40" rx="5" fill="#0D0D14" stroke="#333348" stroke-width="1.5"/>
      <text x="184" y="80" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" text-anchor="middle">#03</text>
      <text x="184" y="95" fill="#64748B" font-family="'SF Mono', Consolas, monospace" font-size="7" text-anchor="middle">GUIDE</text>

      <!-- Precision Cursor Arrow clicking on Step 2 -->
      <path d="M 132 98 L 146 126 L 140 128 L 134 140 L 126 136 L 132 124 L 124 122 Z" fill="#A5B4FC" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Guide Auto-Generated Badge -->
      <rect x="60" y="190" width="115" height="18" rx="4" fill="#0D0D14" stroke="#6366F1" stroke-width="1"/>
      <text x="117" y="202" fill="#A5B4FC" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" text-anchor="middle">LOCAL MV3 CAPTURE</text>
    </g>
    
</svg>